<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Tasks</h1>
  </div>

  <div class="filters">
    <select class="filter-select" [(ngModel)]="statusFilter" (change)="applyFilters()">
      <option value="">All Statuses</option>
      <option value="todo">To Do</option>
      <option value="in-progress">In Progress</option>
      <option value="done">Done</option>
    </select>
    <select class="filter-select" [(ngModel)]="projectFilter" (change)="applyFilters()">
      <option value="">All Projects</option>
      <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
    </select>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Project</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Due Date</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let task of filteredTasks">
        <td>{{ task.title }}</td>
        <td>
          <a [routerLink]="['/projects', task.projectId]">{{ getProjectName(task.projectId) }}</a>
        </td>
        <td><span class="badge badge-{{ task.status }}">{{ task.status }}</span></td>
        <td><span class="badge badge-{{ task.priority }}">{{ task.priority }}</span></td>
        <td>{{ task.dueDate }}</td>
      </tr>
      <tr *ngIf="filteredTasks.length === 0">
        <td colspan="5" class="empty-state">No tasks found.</td>
      </tr>
    </tbody>
  </table>
</div>
