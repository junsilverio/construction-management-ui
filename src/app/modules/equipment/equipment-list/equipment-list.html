<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Equipment</h1>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Status</th>
        <th>Assigned Project</th>
        <th>Last Maintenance</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of equipmentList">
        <td>{{ item.name }}</td>
        <td>{{ item.type }}</td>
        <td><span class="badge badge-{{ item.status }}">{{ item.status }}</span></td>
        <td>
          <a *ngIf="item.projectId; else noProject" [routerLink]="['/projects', item.projectId]">
            {{ getProjectName(item.projectId) }}
          </a>
          <ng-template #noProject>—</ng-template>
        </td>
        <td>{{ item.lastMaintenance }}</td>
      </tr>
    </tbody>
  </table>
</div>
