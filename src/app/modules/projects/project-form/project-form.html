<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">{{ isEdit ? 'Edit Project' : 'New Project' }}</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Project Name *</label>
        <input id="name" type="text" formControlName="name" class="form-control"
               placeholder="Enter project name" />
        <div class="error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          Name is required.
        </div>
      </div>
      <div class="form-group">
        <label for="status">Status *</label>
        <select id="status" formControlName="status" class="form-control">
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" class="form-control" rows="3"
                placeholder="Describe the project"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="location">Location *</label>
        <input id="location" type="text" formControlName="location" class="form-control"
               placeholder="City, State" />
        <div class="error" *ngIf="form.get('location')?.invalid && form.get('location')?.touched">
          Location is required.
        </div>
      </div>
      <div class="form-group">
        <label for="budget">Budget ($) *</label>
        <input id="budget" type="number" formControlName="budget" class="form-control" min="0" />
        <div class="error" *ngIf="form.get('budget')?.invalid && form.get('budget')?.touched">
          Valid budget is required.
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="startDate">Start Date *</label>
        <input id="startDate" type="date" formControlName="startDate" class="form-control" />
        <div class="error" *ngIf="form.get('startDate')?.invalid && form.get('startDate')?.touched">
          Start date is required.
        </div>
      </div>
      <div class="form-group">
        <label for="endDate">End Date *</label>
        <input id="endDate" type="date" formControlName="endDate" class="form-control" />
        <div class="error" *ngIf="form.get('endDate')?.invalid && form.get('endDate')?.touched">
          End date is required.
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        {{ isEdit ? 'Update Project' : 'Create Project' }}
      </button>
    </div>
  </form>
</div>
