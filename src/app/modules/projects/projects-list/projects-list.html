<div class="page-container">
  <div class="page-header">
    <h1 class="page-title">Projects</h1>
    <a routerLink="/projects/new" class="btn btn-primary">+ New Project</a>
  </div>

  <div class="filters">
    <input
      type="text"
      class="search-input"
      placeholder="Search projects..."
      [(ngModel)]="searchTerm"
      (input)="applyFilters()"
    />
    <select class="filter-select" [(ngModel)]="statusFilter" (change)="applyFilters()">
      <option value="">All Statuses</option>
      <option value="planning">Planning</option>
      <option value="in-progress">In Progress</option>
      <option value="on-hold">On Hold</option>
      <option value="completed">Completed</option>
    </select>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Location</th>
        <th>Budget</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let project of filteredProjects">
        <td><a [routerLink]="['/projects', project.id]">{{ project.name }}</a></td>
        <td><span class="badge badge-{{ project.status }}">{{ project.status }}</span></td>
        <td>{{ project.location }}</td>
        <td>{{ project.budget | currency }}</td>
        <td>{{ project.startDate }}</td>
        <td>{{ project.endDate }}</td>
        <td class="actions">
          <a [routerLink]="['/projects', project.id, 'edit']" class="btn btn-sm btn-secondary">Edit</a>
          <button class="btn btn-sm btn-danger" (click)="deleteProject(project.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="filteredProjects.length === 0">
        <td colspan="7" class="empty-state">No projects found.</td>
      </tr>
    </tbody>
  </table>
</div>
